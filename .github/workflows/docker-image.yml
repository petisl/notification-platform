name: Deploy Dev

on:
  push:
    branches: [dev]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Build and push to Azure Container Registry (ACR)
    - name: Build and Push Docker Image
      run: |
        docker build -t cileasinghr.azurecr.io/notification:latest .
        echo "${{ secrets.ACR_PASSWORD }}" | docker login cileasinghr.azurecr.io --username "${{ secrets.ACR_USERNAME }}" --password-stdin
        docker push cileasinghr.azurecr.io/notification:latest

    # Deploy to remote server using SSH with password auth
    - name: Deploy via SSH (Password Auth)
      uses: appleboy/ssh-action@v1
      with:
        host: 51.124.123.164
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}  # Password instead of key
        port: 22
        script: |
          # Log in to Azure Container Registry (ACR)
          echo "${{ secrets.ACR_PASSWORD }}" | docker login cileasinghr.azurecr.io --username "${{ secrets.ACR_USERNAME }}" --password-stdin

          # Stop and remove old container
          docker stop notification-container || true
          docker rm notification-container || true

          # Pull the latest image
          docker pull cileasinghr.azurecr.io/notification:latest

          # Run the new container
          docker run -d \
            --name notification-container \
            -p 80:8084 \
            --restart unless-stopped \
            cileasinghr.azurecr.io/notification:latest

          # Verify it's running
          docker ps
