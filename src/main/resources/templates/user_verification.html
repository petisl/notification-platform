<!DOCTYPE html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/template-layout.html}"
      xmlns:th="http://www.w3.org/1999/xhtml">

<div class="bottom" layout:fragment="content">

    <p>Hi <span th:text="${name}">User</span>,</p>

    <p>
        Thank you for signing up on the C and I Leasing Human Resources Management Platform.
        <br/> <br/>
        To confirm your account, click the button below:
    </p>

    <p style="margin-top: 20px; margin-bottom: 20px;">
        <a th:href="@{|${url}${token}|}"
           style="display:inline-block;
                  padding:12px 20px;
                  background-color:#4CAF50;
                  color:white;
                  text-decoration:none;
                  border-radius:4px;
                  font-weight:bold;">
            Verify Account
        </a>
    </p>

    <p>
        Or copy this link and paste it into your browser:
        <br/>
        <span th:text="@{|${url}${token}|}"></span>
    </p>

</div>

</html>
