<!DOCTYPE html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/template-layout.html}"
      xmlns:th="http://www.w3.org/1999/xhtml">

<div class="bottom" layout:fragment="content" style="font-family: Arial, sans-serif;">

    <p>Hi <span th:text="${displayName}">User</span>,</p>

    <p>
        Here are the employees celebrating their birthdays today:
    </p>

    <table style="width: 100%; border-collapse: collapse;">
        <thead>
        <tr>
            <th style="border: 1px solid #ddd; padding: 8px;">Employee Details</th>
            <th style="border: 1px solid #ddd; padding: 8px;">Company Name</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="user : ${birthdayUsers}">

            <td style="border: 1px solid #ddd; padding: 8px; white-space: pre-line;">
                <strong th:text="${user.birthdayCelebrantName}">John Doe</strong><br/>
                <span th:text="${user.birthdayCelebrantEmail}">john.doe@example.com</span><br/>
                <span th:text="${user.birthdayCelebrantStaffId}">12345</span><br/>
                <span th:text="${user.birthdayCelebrantDepartmentName}">HR</span><br/>
                <span th:text="${user.birthdayCelebrantPositionName}">Manager</span>
            </td>

            <!-- COMPANY NAME -->
            <td style="border: 1px solid #ddd; padding: 8px;"
                th:text="${user.birthdayCompanyName}">
                Acme Corp
            </td>

        </tr>
        </tbody>
    </table>

    <p style="margin-top: 20px;">
        Wishing them a wonderful birthday! 🎉
    </p>

</div>

</html>
