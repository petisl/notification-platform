<!DOCTYPE html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/template-layout.html}"
      xmlns:th="http://www.w3.org/1999/xhtml">

<div class="bottom" layout:fragment="content" style="font-family: Arial, sans-serif;">

    <p>Hi <span th:text="${displayName}">User</span>,</p>

    <p>
        Here are the employees celebrating their hire date anniversary today:
    </p>

    <table style="width: 100%; border-collapse: collapse;">
        <thead>
        <tr>
            <th style="border: 1px solid #ddd; padding: 8px;">Employee Details</th>
            <th style="border: 1px solid #ddd; padding: 8px;">Years of Service</th>
            <th style="border: 1px solid #ddd; padding: 8px;">Company Name</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="user : ${hireDateUsers}">

            <!-- EMPLOYEE DETAILS MERGED COLUMN -->
            <td style="border: 1px solid #ddd; padding: 8px; white-space: pre-line;">
                <strong th:text="${user.hireCelebrantName}">John Doe</strong><br/>
                <span th:text="${user.hireCelebrantEmail}">john.doe@example.com</span><br/>
                <span th:text="${user.hireCelebrantStaffId}">12345</span><br/>
                <span th:text="${user.hireCelebrantDepartmentName}">HR</span><br/>
                <span th:text="${user.hireCelebrantPositionName}">Manager</span>
            </td>

            <!-- YEARS OF SERVICE -->
            <td style="border: 1px solid #ddd; padding: 8px;"
                th:text="${user.hireCelebrantYearsOfService}">
                5
            </td>

            <!-- COMPANY NAME -->
            <td style="border: 1px solid #ddd; padding: 8px;"
                th:text="${user.hireCompanyName}">
                Acme Corp
            </td>

        </tr>
        </tbody>
    </table>

    <p style="margin-top: 20px;">
        Congratulations to our employees on their work anniversary! 🎉
    </p>

</div>

</html>
