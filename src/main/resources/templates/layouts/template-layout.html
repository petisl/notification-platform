<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml"
      xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <title></title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style type="text/css">
        #outlook a { padding: 0; }
        body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        p { display: block; margin: 13px 0; }
    </style>
</head>

<body style="word-spacing:normal;background-color:#f4f2ef;padding:15px;">
<div style="background-color:#f4f2ef;">

    <!-- MAIN CARD -->
    <div style="background:#ffffff;margin:0 auto;border-radius:15px;max-width:600px;">
        <table align="center" role="presentation" style="width:100%;border-radius:15px;">
            <tr>
                <td style="padding:10px 0 0 0;text-align:left;"> <!-- reduced padding -->

                    <div class="mj-column-per-100" style="display:inline-block;width:100%;text-align:left;">
                        <table role="presentation" width="100%">
                            <!-- LOGO (top-left) -->
                            <tr>
                                <td style="padding:10px 25px 0 25px;">
                                    <img th:src="@{/image/cileasing_logo.jpeg}"
                                         alt="C & I Leasing Logo"
                                         width="70"
                                         style="width:70px;height:auto;display:block;" />
                                </td>
                            </tr>

                            <!-- CONTENT -->
                            <tr>
                                <td style="padding:20px 25px 40px 25px;">
                                    <div style="font-family:sans-serif;font-size:15px;line-height:1.5;"
                                         layout:fragment="content">
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </div>

                </td>
            </tr>
        </table>
    </div>

    <!-- FOOTER SECTION -->
    <div style="margin:0 auto;max-width:600px;">
        <table align="center" role="presentation" style="width:100%;">
            <tr>
                <td style="padding:10px 0;text-align:center;"> <!-- reduced padding -->
                    <div class="mj-column-per-100">
                        <table width="100%">
                            <tr>
                                <td style="padding:10px 25px;text-align:left;">
                                    <div style="font-family:sans-serif;font-size:13px;color:#7f8ba4;line-height:1.5;">
                                        C &amp; I Leasing PLC<br>
                                        Lagos, Nigeria.<br>
                                        <p>For enquiries, please contact our support team.</p>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </td>
            </tr>
        </table>
    </div>

    <div style="margin:0 auto;max-width:600px;">
        <table align="center" role="presentation" style="width:100%;">
            <tr>
                <td style="padding:10px 0;text-align:center;"> <!-- reduced padding -->
                    <div class="mj-column-per-100">
                        <table width="100%">
                            <tr>
                                <td style="padding:10px 25px;text-align:left;">
                                    <div style="font-family:sans-serif;font-size:13px;color:#7f8ba4;">
                                        © 2025 C and I Leasing PLC.
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </td>
            </tr>
        </table>
    </div>

</div>
</body>
</html>
