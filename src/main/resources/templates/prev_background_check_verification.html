<!DOCTYPE html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/template-layout.html}"
      xmlns:th="http://www.w3.org/1999/xhtml">

<div class="bottom" layout:fragment="content">

    <p>Hi <span th:text="${name}">User</span>,</p>

    <p>
        <span th:text="${username}">The employee</span> from
        <span th:text="${userCompanyName}">the company</span>
        has identified you as their <strong>previous employer</strong>.
        <br/><br/>
        Please help complete their employment verification by answering a few background check questions:
    </p>

    <p style="margin-top: 20px; margin-bottom: 20px;">
        <a th:href="@{|${url}${automatedBackgroundCheckType}&token=${backgroundCheckToken}|}"
           style="display:inline-block;
                  padding:12px 20px;
                  background-color:#223c86;
                  color:white;
                  text-decoration:none;
                  border-radius:4px;
                  font-weight:bold;">
            Begin Previous Employer Check
        </a>
    </p>

    <p>
        Or copy and paste this link into your browser:
        <br/>
        <span th:text="@{|${url}${automatedBackgroundCheckType}&token=${backgroundCheckToken}|}"></span>
    </p>

</div>

</html>
